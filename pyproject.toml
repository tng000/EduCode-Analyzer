[tool.poetry]
name = "educode-analyzer"
version = "0.1.0"
description = "Code similarity analyzer for educational projects"
authors = ["Student <tng00@yandex.ru>"]
readme = "README.md"
packages = [{include = "educode", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
streamlit = "^1.30.0"
pydantic = "^2.6.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.3.0"
pytest = "^8.0.0"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"